<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mad Bull Airdrop - Claim Your Tokens</title>
    <meta name="description" content="Follow @mad_bull9 on X and join @mad_bull9 on Telegram to claim your Mad Bull Airdrop!">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            color: white; 
        }
        .card { 
            background: rgba(255,255,255,0.1); 
            backdrop-filter: blur(10px); 
            border: none; 
        }
        .btn-follow { background: #1DA1F2; border: none; }
        .btn-telegram { background: #0088cc; border: none; }
        .form-control { 
            background: rgba(255,255,255,0.2); 
            border: none; 
            color: white; 
        }
        .form-control::placeholder { color: rgba(255,255,255,0.7); }
        .logo { 
            max-width: 160px; 
            height: auto; 
            margin: 0 auto 20px; 
            display: block; 
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.4)); 
            border-radius: 12px; 
        }
    </style>
</head>
<body class="d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card p-4 shadow-lg">
                    <div class="text-center mb-4">
                        <img src="https://raw.githubusercontent.com/madbull834-crypto/Airdrop/main/logo.jpg" 
                             alt="Mad Bull Logo" class="logo">
                        <h1 class="display-4 fw-bold">Mad Bull Airdrop</h1>
                        <p class="lead">Claim your free tokens now!</p>
                        <p>Follow us and submit your wallet to participate</p>
                    </div>

                    <!-- Step 1 & 2 -->
                    <div class="mb-4">
                        <h5><i class="fab fa-twitter me-2"></i>Step 1: Follow on X (Twitter)</h5>
                        <a href="https://x.com/mad_bull9" target="_blank" class="btn btn-follow btn-lg w-100 mb-3">
                            <i class="fab fa-twitter"></i> Follow @mad_bull9
                        </a>
                    </div>

                    <div class="mb-4">
                        <h5><i class="fab fa-telegram-plane me-2"></i>Step 2: Join Telegram</h5>
                        <a href="https://t.me/mad_bull9" target="_blank" class="btn btn-telegram btn-lg w-100 mb-3">
                            <i class="fab fa-telegram-plane"></i> Join @mad_bull9
                        </a>
                    </div>

                    <!-- Step 3: Google Form -->
                    <h5><i class="fas fa-wallet me-2"></i>Step 3: Submit Your Wallet</h5>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="followed" required>
                        <label class="form-check-label" for="followed">
                            I have followed @mad_bull9 on X and joined @mad_bull9 on Telegram
                        </label>
                    </div>

                    <button id="claimBtn" onclick="openGoogleForm()" class="btn btn-success btn-lg w-100" disabled>
                        <i class="fas fa-gift"></i> Claim Airdrop
                    </button>

                    <p class="text-center small mt-3 text-white-50">
                        Opens secure Google Form in new tab • Responses saved in Google Sheets
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const checkbox = document.getElementById('followed');
        const btn = document.getElementById('claimBtn');

        checkbox.addEventListener('change', function() {
            btn.disabled = !this.checked;
        });

        function openGoogleForm() {
            window.open('https://docs.google.com/forms/d/e/1FAIpQLSfgGdYx7b4AH-BDSxOeo3K5hdaQKPtPpt_i25sN-ul9lfduiA/viewform?usp=header', '_blank');
        }
    </script>
</body>
</html>
