<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mad Bull Airdrop - Claim Your Tokens</title>
    <meta name="description" content="Follow @mad_bull9 on X and join @mad_bull9 on Telegram to claim your Mad Bull Airdrop!">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: white; }
        .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: none; }
        .btn-follow { background: #1DA1F2; border: none; }
        .btn-telegram { background: #0088cc; border: none; }
        .form-control { background: rgba(255,255,255,0.2); border: none; color: white; }
        .form-control::placeholder { color: rgba(255,255,255,0.7); }
    </style>
</head>
<body class="d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card p-4 shadow-lg">
                    <div class="text-center mb-4">
                        <h1 class="display-4 fw-bold"> Mad Bull Airdrop</h1>
                        <p class="lead">Claim your free tokens now!</p>
                        <p>Follow us and submit your wallet to participate</p>
                    </div>

                    <!-- Follow Steps -->
                    <div class="mb-4">
                        <h5><i class="fab fa-twitter me-2"></i>Step 1: Follow on X (Twitter)</h5>
                        <a href="https://x.com/mad_bull9" target="_blank" class="btn btn-follow btn-lg w-100 mb-3">
                            <i class="fab fa-twitter"></i> Follow @mad_bull9
                        </a>
                    </div>

                    <div class="mb-4">
                        <h5><i class="fab fa-telegram-plane me-2"></i>Step 2: Join Telegram</h5>
                        <a href="https://t.me/mad_bull9" target="_blank" class="btn btn-telegram btn-lg w-100 mb-3">
                            <i class="fab fa-telegram-plane"></i> Join @mad_bull9
                        </a>
                    </div>

                    <!-- Wallet Form -->
                    <h5><i class="fas fa-wallet me-2"></i>Step 3: Submit Wallet</h5>
                    <form id="claimForm" action="https://formspree.io/f/mbdagbgg" method="POST"> <!-- Replace with your Formspree or other endpoint -->
                        <div class="mb-3">
                            <label class="form-label">Your X/Twitter Username</label>
                            <input type="text" class="form-control" name="twitter" placeholder="@yourusername" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Your Telegram Username</label>
                            <input type="text" class="form-control" name="telegram" placeholder="@yourusername" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Wallet Address SOL</label>
                            <input type="text" class="form-control" name="wallet" placeholder="0x..." required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="followed" required>
                            <label class="form-check-label" for="followed">I have followed @mad_bull9 on X and joined @mad_bull9 on Telegram</label>
                        </div>
                        <button type="submit" class="btn btn-success btn-lg w-100">
                            <i class="fas fa-gift"></i> Claim Airdrop
                        </button>
                    </form>

                    <div class="text-center mt-4 small">
                        <p>Submissions are reviewed manually. Winners announced on Telegram!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simple client-side validation
        document.getElementById('claimForm').addEventListener('submit', function(e) {
            if (!document.getElementById('followed').checked) {
                e.preventDefault();
                alert('Please confirm you followed both accounts!');
            }
        });
    </script>
</body>
</html>
